name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Docs and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No .env committed
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git. Secrets must never be committed."
            exit 1
          fi
          echo "No .env in the index."

      - name: Markdown links resolve
        run: python3 .github/scripts/check_links.py

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is there Python to check?
        id: detect
        run: |
          if [ -f pyproject.toml ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No pyproject.toml yet — skipping. This job starts working at build step 2."
          fi

      - uses: actions/setup-python@v7
        if: steps.detect.outputs.found == 'true'
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        if: steps.detect.outputs.found == 'true'
        run: pip install -e ".[dev]"

      - name: Lint
        if: steps.detect.outputs.found == 'true'
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        if: steps.detect.outputs.found == 'true'
        run: pytest -q

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is there a web app to check?
        id: detect
        run: |
          if [ -f web/package.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No web/package.json yet — skipping. This job starts working at build step 4."
          fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.found == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        if: steps.detect.outputs.found == 'true'
        working-directory: web
        run: npm ci

      - name: Lint and typecheck
        if: steps.detect.outputs.found == 'true'
        working-directory: web
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Build
        if: steps.detect.outputs.found == 'true'
        working-directory: web
        run: npm run build
