# Dependency updates. Required by the Tech Stack's security rules.
#
# Only ecosystems whose manifest actually exists may be listed: Dependabot
# ERRORS on a missing manifest, it does not quietly find nothing. Uncomment
# each block as the build step that creates its manifest lands.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Uncomment at build step 2, once pyproject.toml exists:
  # - package-ecosystem: pip
  #   directory: /
  #   schedule:
  #     interval: weekly
  #   open-pull-requests-limit: 5

  # Uncomment at build step 4, once web/package.json exists:
  # - package-ecosystem: npm
  #   directory: /web
  #   schedule:
  #     interval: weekly
  #   open-pull-requests-limit: 5

  # Uncomment at build step 6, once infra/ holds a Dockerfile or compose file:
  # - package-ecosystem: docker
  #   directory: /infra
  #   schedule:
  #     interval: weekly
  #   open-pull-requests-limit: 5
